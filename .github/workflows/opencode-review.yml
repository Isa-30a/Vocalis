name: OpenCode review

on:
  pull_request:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  review:
    # OIDC tokens are available to fork PRs, so only review branches in this repo.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$EVENT_PR_NUMBER" ]; then
            echo "PR_NUMBER=$EVENT_PR_NUMBER" >> "$GITHUB_ENV"
            echo "BASE_REF=$EVENT_BASE_REF" >> "$GITHUB_ENV"
          else
            number=$(gh pr view --json number --jq .number)
            base=$(gh pr view "$number" --json baseRefName --jq .baseRefName)
            echo "PR_NUMBER=$number" >> "$GITHUB_ENV"
            echo "BASE_REF=$base" >> "$GITHUB_ENV"
          fi

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
          OPENCODE_CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID }}
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          if [ -z "$oidc" ] || [ "$oidc" = "null" ]; then
            echo "::error::Could not obtain a GitHub OIDC token."
            exit 1
          fi

          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$OPENCODE_CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::OpenCode token exchange failed."
            exit 1
          fi

          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Render review prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/opencode/render-command.py \
            .opencode/commands/review.md \
            "$PR_NUMBER" > "$RUNNER_TEMP/prompt.md"

      - name: Review PR
        run: |
          opencode run \
            --standalone \
            --auto \
            --archived \
            --format json \
            --agent plan \
            --model opencode-go/deepseek-v4.1-flash \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/events.jsonl"

          python3 .github/opencode/extract-review.py \
            < "$RUNNER_TEMP/events.jsonl" > "$RUNNER_TEMP/review.md"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/review.md" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/review.md"
          fi
